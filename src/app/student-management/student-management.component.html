<div class="student-management">
    <mat-card>
      <mat-card-header>
        <mat-card-title>Student Management</mat-card-title>
      </mat-card-header>
      
      <mat-card-content>
        <div class="action-buttons">
          <button mat-raised-button color="primary" (click)="openAddDialog()">
            <mat-icon>add</mat-icon> Add Student
          </button>
        </div>
        
        <mat-table [dataSource]="dataSource" matSort>
          <!-- Student ID Column -->
          <ng-container matColumnDef="studentId">
            <mat-header-cell *matHeaderCellDef mat-sort-header>ID</mat-header-cell>
            <mat-cell *matCellDef="let student">{{ student.studentId }}</mat-cell>
          </ng-container>
          
          <!-- Name Column -->
          <ng-container matColumnDef="name">
            <mat-header-cell *matHeaderCellDef mat-sort-header>Name</mat-header-cell>
            <mat-cell *matCellDef="let student">
              {{ student.firstName }} {{ student.lastName }}
            </mat-cell>
          </ng-container>
          
          <!-- Class Column -->
          <ng-container matColumnDef="class">
            <mat-header-cell *matHeaderCellDef mat-sort-header>Class</mat-header-cell>
            <mat-cell *matCellDef="let student">{{ student.class }}</mat-cell>
          </ng-container>
          
          <!-- Score Column -->
          <ng-container matColumnDef="score">
            <mat-header-cell *matHeaderCellDef mat-sort-header>Score</mat-header-cell>
            <mat-cell *matCellDef="let student">{{ student.score }}</mat-cell>
          </ng-container>
          
          <!-- Status Column -->
          <ng-container matColumnDef="status">
            <mat-header-cell *matHeaderCellDef mat-sort-header>Status</mat-header-cell>
            <mat-cell *matCellDef="let student">
              <mat-chip [color]="student.status ? 'primary' : 'warn'">
                {{ student.status ? 'Active' : 'Inactive' }}
              </mat-chip>
            </mat-cell>
          </ng-container>
          
          <!-- Actions Column -->
          <ng-container matColumnDef="actions">
            <mat-header-cell *matHeaderCellDef>Actions</mat-header-cell>
            <mat-cell *matCellDef="let student">
              <button mat-icon-button color="primary" (click)="viewStudent(student)">
                <mat-icon>visibility</mat-icon>
              </button>
              <button mat-icon-button color="accent" (click)="editStudent(student)">
                <mat-icon>edit</mat-icon>
              </button>
              <button mat-icon-button color="warn" (click)="deleteStudent(student)">
                <mat-icon>delete</mat-icon>
              </button>
            </mat-cell>
          </ng-container>
          
          <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
          <mat-row *matRowDef="let row; columns: displayedColumns;"></mat-row>
        </mat-table>
        
        <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]"></mat-paginator>
      </mat-card-content>
    </mat-card>
  </div>
